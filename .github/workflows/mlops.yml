name: MLOps Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Generate bundled public datasets and verify DVC hashes
        run: |
          python src/prepare_data.py
          python scripts/verify_data.py
      - name: Reproduce training without a private remote
        run: dvc repro --force
      - name: Validate models and metrics
        run: python scripts/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: iris-results
          path: |
            reports/
            models/
